name: DarkTV Android TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/tv/**"
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Sincronizar app da TV
        run: |
          rm -rf android-tv/app/src/main/assets/www
          mkdir -p android-tv/app/src/main/assets/www
          cp -a public/tv/. android-tv/app/src/main/assets/www/
          rm -f android-tv/app/src/main/assets/www/appinfo.json

          cp android-tv/tv-fit.css android-tv/app/src/main/assets/www/tv-fit.css
          cp android-tv/tv-fit.js android-tv/app/src/main/assets/www/tv-fit.js

          python3 <<'PY'
          from pathlib import Path

          p = Path("android-tv/app/src/main/assets/www/index.html")
          s = p.read_text(encoding="utf-8")

          if 'href="tv-fit.css"' not in s:
              s = s.replace(
                  '<link rel="stylesheet" href="styles.css" />',
                  '<link rel="stylesheet" href="styles.css" />\n    <link rel="stylesheet" href="tv-fit.css" />'
              )

          if 'src="tv-fit.js"' not in s:
              s = s.replace(
                  '<script src="app.js"></script>',
                  '<script src="app.js"></script>\n    <script src="tv-fit.js"></script>'
              )

          p.write_text(s, encoding="utf-8")
          PY

          echo "APP.JS:"
          sha256sum public/tv/app.js android-tv/app/src/main/assets/www/app.js
          echo "STYLES.CSS:"
          sha256sum public/tv/styles.css android-tv/app/src/main/assets/www/styles.css

      - name: Gerar APK
        working-directory: android-tv
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Conferir APK
        run: |
          mkdir -p apk-out
          cp android-tv/app/build/outputs/apk/release/app-release.apk apk-out/DarkTV-AndroidTV.apk
          ls -lh apk-out
          sha256sum apk-out/DarkTV-AndroidTV.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkTV-Android-TV
          path: apk-out/DarkTV-AndroidTV.apk
          if-no-files-found: error
