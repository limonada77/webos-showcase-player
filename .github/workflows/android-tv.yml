name: DarkTV Android TV

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "android-tv/**"
      - ".github/workflows/android-tv.yml"

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Gerar APK
        working-directory: android-tv
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Conferir APK
        run: |
          mkdir -p apk-out
          cp android-tv/app/build/outputs/apk/release/app-release.apk apk-out/DarkTV-AndroidTV.apk
          ls -lh apk-out
          sha256sum apk-out/DarkTV-AndroidTV.apk

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: DarkTV-Android-TV
          path: apk-out/DarkTV-AndroidTV.apk
          if-no-files-found: error
