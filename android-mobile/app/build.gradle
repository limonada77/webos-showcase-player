plugins {
    id 'com.android.application'
}

android {
    namespace 'com.darktv.mobile'
    compileSdk 35

    defaultConfig {
        applicationId "com.darktv.mobile"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave debug para instalar diretamente pelo APK.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
