plugins {
    id 'com.android.application'
}

android {
    namespace 'com.darktv.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.darktv.app"
        minSdk 23
        targetSdk 35
        versionCode 3
        versionName "1.0.2"
    }

    buildTypes {
        release {
            minifyEnabled false
            // Assinado com a chave debug para instalar direto na TV via APK.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
